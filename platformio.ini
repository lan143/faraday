[env:faraday]
platform = espressif32@==7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    colorize
    esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/platformio_version.py
lib_deps =
    ESP32Async/ESPAsyncWebServer@==3.12.1
    ESP32Async/AsyncTCP@==3.5.0
    ArduinoJSON@==7.4.3
    FS
    https://github.com/lan143/ed-mqtt#0.1.1
    https://github.com/lan143/ed-config#47def1f1fd8df21900aad6af71bf81c4321b1dee
    https://github.com/lan143/ed-utils#0.2.0
    https://github.com/lan143/ed-ha#f6ca848b4189e6ce48470d73eb603f14bfc0837f
    https://github.com/lan143/ed-healthcheck#0.2.0
    https://github.com/lan143/ed-network#e6450b937e3cf24d06c4f720b00f246b10b01824
    PCF8574@==0.4.4
    https://github.com/lan143/ed-wb#dfa808b1bf57e160d4bab5511fb439963e23364f
    https://github.com/lan143/ed-common#0.6.0
# ESPAsyncTCP/RPAsyncTCP are the ESP8266/RaspberryPi TCP stacks that leak into the
# dependency graph transitively (async-mqtt-client/ESPAsyncWebServer manifests);
# they must not be built for ESP32 — AsyncTCP is the correct one.
lib_ignore = ESPAsyncTCP, RPAsyncTCP
build_flags=
    -Wshadow
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_COLORS=1
    -DCONFIG_HEAP_POISONING_LIGHT=y

[env:faraday_ota]
extends = env:faraday
upload_protocol = espota
# Upload target and credentials come from the untracked /.env (see .env.example).
# build_flags is intentionally NOT redefined here: in PlatformIO an extending
# environment replaces (not appends) the parent list, which would drop the
# warning/esp-idf flags above.
extra_scripts = pre:scripts/platformio_version.py, pre:scripts/ota_env.py
